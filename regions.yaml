# The La Défense fixture with its communes in two départements (tests/fixtures/ci-admin-split):
# whole (ci-split), and in two parts merged (ci-parts), which must give the same build.
ci-split:
  pbf: tests/fixtures/ci.osm.pbf
  crs: EPSG:2154
  admin:
    source: tests/fixtures/ci-admin-split
  covers: [ci]

ci-parts:
  pbf: tests/fixtures/ci.osm.pbf
  crs: EPSG:2154
  admin:
    source: tests/fixtures/ci-admin-split
  parts: [ci-east, ci-west]
  covers: [ci-split]

ci-east:
  parent: ci-parts
  aggregate: ci-parts
  buffer_m: 480
  crs: EPSG:2154
  admin:
    source: tests/fixtures/ci-admin-split
    departements: ["92"]

ci-west:
  parent: ci-parts
  aggregate: ci-parts
  buffer_m: 480
  crs: EPSG:2154
  admin:
    source: tests/fixtures/ci-admin-split
    departements: ["9W"]
