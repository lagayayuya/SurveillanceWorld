# Processing regions. A region is built from one .osm.pbf, either downloaded or cut from a
# parent region. `crs` is the metric projection used for all geometric computation.
# `admin`: the IGN ADMIN EXPRESS COG CARTO layers (see README) and the départements kept.

idf:
  url: https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf
  pbf: data/src/ile-de-france-latest.osm.pbf
  crs: EPSG:2154
  admin:
    source: data/src/admin-express-2026
    departements: ["75", "77", "78", "91", "92", "93", "94", "95"]

puteaux:
  parent: idf
  communes: ["Puteaux", "Courbevoie"]
  buffer_m: 300
  crs: EPSG:2154
  admin:
    source: data/src/admin-express-2026
    departements: ["92"]

ci:
  pbf: tests/fixtures/ci.osm.pbf
  crs: EPSG:2154
  admin:
    source: tests/fixtures/ci-admin

# Metropolitan France, Corsica included (2026-10-22): built in parts, one per former region
# (2015: the largest, Rhône-Alpes, ~0.5 GB of .pbf, fits the build machine's memory alone),
# then merged (merge.py). Each part is cut from the France extract along its départements
# widened by 480 m (max_range_m 180 m + 300 m): its cameras see the neighbours' buildings
# and its streets the neighbours' cameras. Overseas is a later region: other projections.
france:
  url: https://download.geofabrik.de/europe/france-latest.osm.pbf
  pbf: data/france/src/france-latest.osm.pbf
  crs: EPSG:2154
  admin:
    source: data/src/admin-express-2026
  parts:
    - fr-alsace
    - fr-aquitaine
    - fr-auvergne
    - fr-basse-normandie
    - fr-bourgogne
    - fr-bretagne
    - fr-centre
    - fr-champagne-ardenne
    - fr-corse
    - fr-franche-comte
    - fr-haute-normandie
    - fr-idf
    - fr-languedoc-roussillon
    - fr-limousin
    - fr-lorraine
    - fr-midi-pyrenees
    - fr-nord-pas-de-calais
    - fr-pays-de-la-loire
    - fr-picardie
    - fr-poitou-charentes
    - fr-paca
    - fr-rhone-alpes
  covers: [idf]

fr-alsace:
  parent: france
  aggregate: france
  buffer_m: 480
  crs: EPSG:2154
  admin:
    source: data/src/admin-express-2026
    departements: ["67", "68"]

