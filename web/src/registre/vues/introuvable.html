<div class="{{th}}">
  <div class="{{lay.inner}}">
    <!-- a page of the register, not a fiche: its title in cut-out letters as the summary's (V2-Sommaire) -->
    <h1 class="sr">{{titre}}</h1><div class="{{lay.cut}}" aria-hidden="true"><sc-for list="{{mots}}" as="m"><span class="mot"><sc-for list="{{m.lettres}}" as="x"><span class="{{x.cls}}" style="{{x.st}}">{{x.ch}}</span></sc-for></span></sc-for></div>
    <p class="lead">{{phrase}}</p>
    <p class="sober" style="margin: 18px 0 0"><a href="/registre/" style="font-weight: 700">{{t.introuvable.retour}}</a></p>
  </div>
</div>
