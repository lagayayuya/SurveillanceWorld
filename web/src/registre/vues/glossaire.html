<div class="{{th}}">
  <div class="{{lay.inner}}">
    <!-- a page of the register, not a fiche: its title in cut-out letters as the summary's (V2-Sommaire) -->
    <h1 class="sr">{{t.glossaire.les_mots_du_registre}}</h1><div class="{{lay.cut}}" aria-hidden="true"><sc-for list="{{mots}}" as="m"><span class="mot"><sc-for list="{{m.lettres}}" as="x"><span class="{{x.cls}}" style="{{x.st}}">{{x.ch}}</span></sc-for></span></sc-for></div>
    <p class="idline tw">{{f.glossaire.entrees_chaque_mot_renvoie_vers}}</p>

    <div class="gl">
      <nav aria-label="{{t.glossaire.index_du_glossaire}}" class="glnav">
        <label class="filt">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <span class="sr">{{t.glossaire.filtrer_le_glossaire}}</span>
          <input type="search" value="{{q}}" onInput="{{onQ}}" placeholder="{{t.glossaire.filtrer_drone_contrat}}">
        </label>
        <span class="tw" role="status" style="font-size: 13px; color: var(--muted)">{{countLabel}}</span>
        <div class="idx">
          <sc-for list="{{items}}" as="g">
            <a href="{{g.anchor}}">{{g.t}}</a>
          </sc-for>
        </div>
      </nav>

      <div class="glmots">
        <sc-for list="{{items}}" as="g">
          <article class="{{g.cls}}" id="{{g.id}}" tabindex="{{g.tab}}">
            <div class="gltete"><h2 class="h3">{{g.t}}</h2><sc-if value="{{g.r}}"><span class="stk sm" style="{{g.r.c}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.r.i}}"></path></svg>{{g.r.l}}</span></sc-if></div>
            <p>{{{g.d}}}</p>
            <sc-if value="{{g.hasEx}}"><p class="glex">{{{g.exemple}}}</p></sc-if>
          </article>
        </sc-for>
        <sc-if value="{{none}}"><p style="margin: 18px 0 0; color: var(--muted)">{{t.glossaire.aucun_mot_ne_correspond_essayez}}</p></sc-if>
      </div>
    </div>
  </div>
</div>
