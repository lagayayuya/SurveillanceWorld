<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%t:app.name%</title>
    <!-- The logo L3 (2026-10-15), its 16 and 32 px drawn as variant C: the SVG changes its
         ink with the system's mode; PNG for the browsers without SVG icons, both sizes in
         light and dark; the home screen's from the manifest (vite.config.ts). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-32-dark.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-16-dark.png" type="image/png" sizes="16x16" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fetched without credentials unless use-credentials, even on the same origin: behind
         the preview's password it was answered 401 (WebKit on Linux asks for it). -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Share metadata, from the catalogue at build time (vite.config.ts); the absolute
         addresses from the deploy's host (VITE_SITE_URL), never written here. The preview
         image is the site's own file (/og.jpg, A2 of 2026-10-15): nothing from a third party. -->
    <meta name="description" content="%t:app.description%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="%t:app.name%" />
    <meta property="og:title" content="%t:share.title%" />
    <meta property="og:description" content="%t:share.description%" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- site -->
    <meta property="og:url" content="%site%/" />
    <meta property="og:image" content="%site%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%t:share.image_alt%" />
    <!-- /site -->
    <script src="/carte-prepaint.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <div id="estimate" role="group"></div>
    <aside id="filters"></aside>
    <div id="fabs">
      <button id="fab-filters" class="fab"></button>
      <button id="fab-locate" class="fab"></button>
    </div>
    <aside id="sheet" hidden></aside>
    <!-- « Chargement » (board 2c of « Chargement punk »: src/loading.ts, src/loading.css),
         inert until the page clones it; its words from the catalogue. -->
    <template
      id="loading-template"
      data-word="%t:loading.word%"
      data-map="%t:loading.line.map%"
      data-account="%t:loading.line.account%"
      data-said-map="%t:loading.said.map%"
      data-said-account="%t:loading.said.account%"
    >
      <div class="loading" role="status">
        <span class="loading-said"></span>
        <div class="loading-stage" aria-hidden="true">
          <div class="loading-hook">
            <div class="loading-arm loading-arm-a">
              <div class="loading-joint"></div>
              <div class="loading-arm loading-arm-b">
                <div class="loading-joint"></div>
                <div class="loading-head">
                  <div class="loading-front">
                    <div class="loading-top"></div>
                    <div class="loading-collar"></div>
                    <div class="loading-stem"></div>
                    <div class="loading-nut"></div>
                    <div class="loading-body"></div>
                    <div class="loading-window">
                      <div class="loading-band"></div>
                      <div class="loading-led"></div>
                      <div class="loading-cheek"></div>
                      <div class="loading-cheek"></div>
                      <div class="loading-lens">
                        <div class="loading-glass">
                          <div class="loading-pupil">
                            <div class="loading-iris"></div>
                            <div class="loading-glint"></div>
                            <div class="loading-glint"></div>
                          </div>
                          <div class="loading-lid"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="loading-joint"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="loading-mount"></div>
        </div>
        <div class="loading-label" aria-hidden="true">
          <span class="loading-word"></span>
          <span class="loading-line"><span class="loading-line-text"></span><span class="loading-caret">▌</span></span>
        </div>
      </div>
    </template>
    <script src="/carte-chargement.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
