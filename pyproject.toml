[project]
name = "lacarte"
version = "0.0.0"
description = "Citizen map of video surveillance built from OpenStreetMap data"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.4",
    "h3>=4.5.0",
    "numpy>=2.5.3",
    "osmium>=4.3.1",
    "pmtiles>=3.8.1",
    "pyarrow>=25.0.1",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "shapely>=2.1.2",
]

[dependency-groups]
api = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "shapely>=2.1.2",
    "uvicorn>=0.54.0",
]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.2",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
# The API's dependencies stay out of the pipeline's; locally and in CI both are installed.
default-groups = ["dev", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/lacarte"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["lacarte"]

[project.scripts]
lacarte = "lacarte.cli:main"
