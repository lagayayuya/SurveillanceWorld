name: ci

# Documentation alone (*.md) runs nothing. A push (or a pull request) runs the light CI:
# `check` and two smoke tests, the phone and participation in WebKit.
# workflow_dispatch runs the full matrix (every smoke test, both engines);
# locally `make smoke` runs the same. A new run cancels the one in progress on the same
# branch and event (a push never cancels a manual full run). `prepare` builds the CI extract
# once for the smoke jobs, which run in parallel, and says which of them run. No secret is
# used and nothing is deployed from here.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The CI extract's pipeline once (artifact for the smoke jobs), and which smoke tests run
  # (the light set or the full matrix).
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      smoke: ${{ steps.matrix.outputs.smoke }}
      engines: ${{ steps.matrix.outputs.engines }}
    steps:
      - uses: actions/checkout@v4
      # Names of the `smoke` job's entries, and the participation job's engines.
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo 'smoke=["desktop","phone-webkit","phone-chromium","theme-webkit","theme-chromium","chips-webkit","chips-chromium","profile-webkit","profile-chromium"]' >> "$GITHUB_OUTPUT"
            echo 'engines=["webkit","chromium"]' >> "$GITHUB_OUTPUT"
          else
            echo 'smoke=["phone-webkit"]' >> "$GITHUB_OUTPUT"
            echo 'engines=["webkit"]' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
      # With the synthetic validated contributions (moved, gone, conflicts): the smoke tests
      # read their sheets; a build without them is checked byte for byte by pytest.
      - name: Pipeline on the frozen mini extract (La Défense, 92 cameras)
        run: |
          mkdir -p data/contrib
          cp tests/fixtures/contrib-ci.jsonl data/contrib/ci.jsonl
          make build REGION=ci
      - uses: actions/upload-artifact@v4
        with:
          name: ci-build
          path: data/build/ci
          retention-days: 1

  check:
    runs-on: ubuntu-24.04
    # PostGIS for the participation database tests (Docker in CI only, never on the server):
    # the server's majors (Debian 13: PostgreSQL 17, PostGIS 3.5), the image pinned by its
    # digest, so that a moving tag never changes them under the tests; the job prints them.
    services:
      postgis:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lacarte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          caddy: "true"
      - name: The service's versions
        run: psql "$TEST_DSN" -Atc "SELECT version()" -c "SELECT postgis_full_version()"
        env:
          TEST_DSN: postgresql://test:test@localhost:5432/lacarte
      - run: make check
        env:
          REQUIRE_CADDY: "1"
          REQUIRE_PG: "1"
          TEST_DSN: postgresql://test:test@localhost:5432/lacarte

  # The map's smoke tests on the mini extract and its versioned basemap: desktop and the
  # phone test in each engine, one browser per job (the phone test also runs in halves with
  # --part 1|2, for a longer test later); and the theme's own test. Which ones: the
  # `prepare` job's list (a push: the phone in WebKit).
  smoke:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.prepare.outputs.smoke) }}
    name: smoke (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/smoke-setup
        with:
          engines: ${{ contains(matrix.name, 'webkit') && 'webkit' || 'chromium' }}
      # Durations measured and printed, never failing on these shared machines (the local
      # gate keeps their limits). WebKit reports the fetches a closing page cancels as page
      # errors (« access control checks »): a run whose only failures are those goes again,
      # once, said in the run's annotations; any other failure fails at once.
      - env:
          NAME: ${{ matrix.name }}
          BENCH_TIMING: report
        run: |
          case "$NAME" in
            desktop) script="smoke.mjs --region ci" ;;
            phone-webkit) script="smoke-mobile.mjs --region ci --browser webkit" ;;
            phone-chromium) script="smoke-mobile.mjs --region ci --browser chromium" ;;
            theme-webkit) script="smoke-theme.mjs --region ci --browser webkit" ;;
            theme-chromium) script="smoke-theme.mjs --region ci --browser chromium" ;;
            chips-webkit) script="smoke-chips.mjs --browser webkit" ;;
            chips-chromium) script="smoke-chips.mjs --browser chromium" ;;
            profile-webkit) script="smoke-profile.mjs --browser webkit" ;;
            profile-chromium) script="smoke-profile.mjs --browser chromium" ;;
            *) echo "unknown smoke test $NAME"; exit 1 ;;
          esac
          cd web
          log="$(mktemp)"
          set +e # the bench's own exit, whatever the shell's pipefail
          node bench/$script 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          only_access_control() {
            awk '/^FAIL/ { n++; d = $0; p = index(d, " — "); d = p ? substr(d, p + length(" — ")) : "";
                   if ($0 !~ /no page error/) bad = 1;
                   k = split(d, parts, / \| /);
                   for (i = 1; i <= k; i++) if (parts[i] !~ /due to access control checks\.?$/) bad = 1 }
                 END { exit !(n > 0 && !bad) }' "$1"
          }
          if [ "$code" != 0 ] && [[ "$NAME" == *webkit* ]] && only_access_control "$log"; then
            echo "::warning::$NAME: only WebKit's « access control checks » page errors failed; running it again, once"
            set +e
            node bench/$script
            code=$?
            set -e
          fi
          exit "$code"

  # Participation on the phone, behind the real site file (Caddy), with PostGIS, one engine
  # per job (both in one job made it the longest one: 447 s); the engines of
  # the `prepare` job (a push: WebKit).
  smoke-participate:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.prepare.outputs.engines) }}
    name: smoke (participate-${{ matrix.engine }})
    services:
      postgis:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lacarte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DSN: postgresql://test:test@localhost:5432/lacarte
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          geo: "false"
          caddy: "true"
      - uses: ./.github/actions/smoke-setup
        with:
          engines: ${{ matrix.engine }}
      # WebKit on Linux is answered 401 for /manifest.webmanifest behind the preview's basic
      # auth, though the link asks for credentials; the bench needs that auth (one user per
      # page) and production has none on the map. On CI only, a run whose only failure is that
      # passes with a warning; any other failure fails, and the local gate keeps it binding.
      - env:
          ENGINE: ${{ matrix.engine }}
          BENCH_TIMING: report
        run: |
          cd web
          log="$(mktemp)"
          set +e # the bench's own exit, whatever the shell's pipefail
          node bench/smoke-participate.mjs --browser "$ENGINE" 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          only_manifest_401() {
            awk '/^FAIL/ { n++; d = $0; p = index(d, " — "); d = p ? substr(d, p + length(" — ")) : "";
                   if ($0 !~ /no unexpected failed request/) bad = 1;
                   k = split(d, parts, / ; /);
                   for (i = 1; i <= k; i++) if (parts[i] !~ /^401 http:\/\/[^ ]*\/manifest\.webmanifest$/) bad = 1 }
                 END { exit !(n > 0 && !bad) }' "$1"
          }
          if [ "$code" != 0 ] && [ "$ENGINE" = webkit ] && only_manifest_401 "$log"; then
            echo "::warning::participate-$ENGINE: not binding on CI: WebKit on Linux + the preview's basic auth (401 on /manifest.webmanifest), followed outside CI"
            code=0
          fi
          exit "$code"
      # A failed run's screenshot and report (the panel's state, the last clicks, the map's
      # camera calls, the API requests unanswered): what its log cannot show.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: participate-${{ matrix.engine }}-failure
          path: /tmp/smoke-part-*/failure.*
          if-no-files-found: ignore
          overwrite: true # a re-run attempt that fails again
          retention-days: 7
