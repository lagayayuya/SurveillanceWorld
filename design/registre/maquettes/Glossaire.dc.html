<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["clair","sombre"],"default":"sombre"},"$preview":{"width":1280,"height":9600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: (props.theme ?? 'sombre') === 'sombre', q: '' };
  }
  renderVals() {
    const S = this.state;
    const dark = S.dark;
    const norm = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const G = [["accord-cadre","Accord-cadre","Un contrat qui fixe les règles et un plafond, puis donne lieu à des commandes ou à des contrats « subséquents » au fil des besoins.","Saint-Priest","Documents-grand.dc.html"],["acheteur","Acheteur","L'administration qui passe le contrat : une commune, une intercommunalité, un département, un ministère…","la Métropole de Lyon","Acheteur-grand.dc.html"],["acheteur-national","Acheteur national","Un ministère, une direction générale ou un réseau national (France Travail, France Télévisions…) dont les contrats couvrent tout le pays. Il est rattaché au département de son siège, mais sort des totaux d'une commune ou d'un département.","la recherche dans Paris","Registre.dc.html"],["acte","Acte, arrêté","Une décision écrite de la préfecture. Un arrêté porte un numéro (par exemple 69-2026-06-30-00021) et paraît au recueil des actes administratifs.","un arrêté de Mions","Autorisations-grand.dc.html"],["analyse-algorithmique","Analyse algorithmique des images","Un logiciel examine les images des caméras pour repérer certains événements (mouvement de foule, objet abandonné…). Son usage par la police est une expérimentation encadrée par la loi du 19 mai 2023 (article 10). Sur la carte, sa zone est hachurée jaune et noir.","le Stade de France","CarteTemps-grand.dc.html"],["appel-offres","Appel d'offres","L'annonce par laquelle une collectivité demande aux entreprises de proposer un prix pour un achat. Il est publié au BOAMP ou au Journal officiel de l'Union européenne.","l'appel d'offres de Mions de juillet 2026","Contrat-grand.dc.html"],["drones","Autorisation de drones","La préfecture autorise la police, la gendarmerie ou l'armée à filmer avec des drones, pour une période et dans une zone précises (une manifestation, un match, une fête).","Meyzieu","CarteTemps-grand.dc.html"],["autorisation","Autorisation préfectorale","Pour installer des caméras qui filment la voie publique ou un lieu ouvert au public, il faut une autorisation du préfet, en général pour 5 ans. L'arrêté dit combien de caméras sont autorisées.","Saint-Priest","Commune-grand.dc.html"],["beneficiaire","Bénéficiaire","Celui qui reçoit l'autorisation ou la subvention : une commune, un commerce, une banque, un service de l'État…","Mions","Commune-grand.dc.html"],["boamp","BOAMP","Le Bulletin officiel des annonces des marchés publics, où sont publiés les appels d'offres et leurs résultats.","l'avis 26-71981","Registre.dc.html"],["cada","CADA","La Commission d'accès aux documents administratifs. Si une administration refuse de vous communiquer un document, ou ne répond pas sous un mois, vous pouvez la saisir gratuitement.","les documents introuvables de Mions","Commune-grand.dc.html"],["carte","Caméras sur la carte","Les caméras repérées et ajoutées par des habitants à la carte (OpenStreetMap). Ce n'est pas un inventaire officiel.","Lyon","Commune-grand.dc.html"],["voie-publique","Caméras sur la voie publique","Les caméras qui filment la rue, par opposition à celles qui filment l'intérieur ou les abords d'un bâtiment.","Mions : 125 caméras sur la rue","Autorisations-grand.dc.html"],["pietons","Caméras-piétons","Les petites caméras portées sur l'uniforme des policiers municipaux ou nationaux ; leur usage par une commune est autorisé par la préfecture.","les caméras-piétons dans le Rhône","Registre.dc.html"],["totaux","Ce qui entre dans les totaux","Les totaux additionnent les montants maximums des contrats signés. Ils laissent de côté les contrats des centrales d'achat, les montants à vérifier et, sauf si vous les incluez, les contrats mixtes. Chaque contrat écarté reste dans la liste, avec sa mention.","Charenton-le-Pont","Commune-grand.dc.html"],["centrale","Centrale d'achat","Un organisme public (UGAP, centrale d'achat du numérique…) qui passe un contrat-cadre pour que d'autres acheteurs y commandent. Son montant est le plafond de ce que tous pourront commander, pas une dépense : il n'entre dans aucun total.","la recherche des contrats","Registre.dc.html"],["csu","Centre de supervision","La salle où des agents regardent en direct les images des caméras d'une commune ou d'une intercommunalité.","les centres de supervision","Registre.dc.html"],["nom-non-publie","Commerce ou entreprise (nom masqué)","Le site ne nomme un bénéficiaire privé (commerce, banque…) que s'il est une société ou une association inscrite au répertoire des entreprises (SIRENE). Un entrepreneur individuel, ou un nom qu'on n'a pas pu rapprocher avec certitude, n'est jamais publié : c'est peut-être une personne.","les autorisations privées de Mions","Documents-grand.dc.html"],["contrat","Contrat (marché public)","L'accord signé entre l'acheteur public et l'entreprise retenue. Ses données essentielles (objet, montant, durée, entreprise) sont publiées sur data.gouv.fr pour les contrats de 40 000 € et plus.","le contrat de Mions de 2025","Contrat-grand.dc.html"],["contrat-mixte","Contrat mixte","Un contrat dont l'objet couvre autre chose que la vidéo. Deux familles : « sûreté des bâtiments » (vidéo avec intrusion, alarme, contrôle d'accès, interphonie) et « autres prestations » (gardiennage, sécurité humaine, incendie, éclairage…). La part de la vidéo n'est pas publiée et on ne l'estime pas. Ces contrats sont hors des totaux par défaut ; un bouton par famille permet de les inclure.","les documents de Lyon","Documents-grand.dc.html"],["formats","CSV, JSON, LISEZMOI","CSV : un tableau qui s'ouvre dans un tableur. JSON : le même contenu pour les programmes. LISEZMOI : le fichier qui explique la licence et chaque colonne.","les téléchargements de Mions","Documents-grand.dc.html"],["deliberation","Délibération","La décision votée par une assemblée (conseil municipal, conseil régional…). Les subventions de la Région sont votées par délibération.","une subvention à Mennecy","Contrat-grand.dc.html"],["detr","DETR","Dotation d'équipement des territoires ruraux : une subvention de l'État aux communes et intercommunalités, répartie par la préfecture ; elle finance parfois des caméras.","les subventions dans le Rhône","Registre.dc.html"],["dispositif","Dispositif","Le type de surveillance : vidéoprotection, centre de supervision, drones, caméras-piétons, lecture de plaques, analyse algorithmique des images.","la recherche par dispositif","Registre.dc.html"],["decp","Données de la commande publique","La base nationale, publiée sur data.gouv.fr, des contrats publics de 40 000 € et plus : acheteur, entreprise, objet, montant maximum, durée, modifications.","Serfim T.I.C.","Entreprise-grand.dc.html"],["dossier-prefectoral","Dossier préfectoral","Le numéro qui suit un même système de caméras d'arrêté en arrêté. Ses premiers chiffres donnent souvent l'année d'ouverture.","le dossier de Mions ouvert en 2008","Autorisations-grand.dc.html"],["duree","Durée d'une autorisation","La durée est lue dans l'arrêté (souvent 5 ans). Quand l'arrêté ne la donne pas, le site l'écrit plutôt que de la supposer. Un arrêté qui modifie une autorisation ne renouvelle pas forcément sa durée.","l'autorisation de Mions","Autorisations-grand.dc.html"],["elections","Élections municipales, mandat","Le maire et le conseil municipal sont élus pour six ans : c'est le mandat. Le repère « Élections municipales » sépare les documents signés par deux équipes différentes ; la liste des élus est publiée par l'État (répertoire national des élus).","les documents de Mions","Documents-grand.dc.html"],["empreinte","Empreinte (SHA-256)","Une suite de caractères calculée à partir d'un fichier : si le document change, même d'une virgule, l'empreinte change. Elle prouve qu'on cite bien le même document.","un arrêté de Mions","Autorisations-grand.dc.html"],["historique","Historique","Tous les documents d'une même opération, dans l'ordre : l'appel d'offres, le contrat et ses modifications ; ou les arrêtés successifs d'une même autorisation ; ou une subvention. Dans les exports, la colonne « affaire » en donne l'identifiant.","l'autorisation des caméras de Mions","Autorisations-grand.dc.html"],["insee","INSEE","L'Institut national de la statistique : il publie la population des communes et le répertoire SIRENE.","Mions","Commune-grand.dc.html"],["lapi","LAPI","Lecture automatique des plaques d'immatriculation : des caméras qui lisent les plaques des véhicules et les comparent à des fichiers.","la lecture de plaques","Registre.dc.html"],["licence-ouverte","Licence Ouverte","La licence de l'État pour les données publiques (Etalab 2.0) : réutilisation libre, y compris commerciale, en citant la source. Le registre est publié sous cette licence.","les téléchargements de Mions","Documents-grand.dc.html"],["lien-probable","Lien probable","Un rapprochement que le document ne dit pas lui-même : même acheteur, objet proche ou même entreprise dans l'avis de résultat, contrat signé de 1 à 12 mois après l'appel d'offres. Il peut être faux ; il n'entre dans aucun total.","l'appel d'offres de Mions de 2020","Contrat-grand.dc.html"],["mediane","Médiane","La valeur du milieu : la moitié des communes est au-dessus, l'autre moitié au-dessous. Elle n'est montrée qu'à partir de cinq communes comparables.","la recherche","Registre.dc.html"],["avenant","Modification, avenant","Un changement apporté au contrat après sa signature : durée, montant, entreprise. Les données publiées n'en disent pas la raison.","un contrat modifié 15 fois","Contrat-grand.dc.html"],["montant-maximum","Montant maximum","Le contrat fixe le montant le plus élevé que l'acheteur pourra payer. La dépense réelle peut être plus basse : elle n'est pas publiée.","Mions","Commune-grand.dc.html"],["montant-a-verifier","Montant à vérifier","Un montant qui paraît invraisemblable : plus de 250 € par habitant de l'acheteur (et au moins 500 000 €), une mission d'études à plus de 1 M€, un montant très supérieur à celui annoncé dans l'appel d'offres, ou le même montant publié par plusieurs acheteurs le même mois (groupement de commandes). Il reste affiché, hors des totaux, et part en relecture.","Charenton-le-Pont","Documents-grand.dc.html"],["odbl","ODbL","La licence des données d'OpenStreetMap : on peut les réutiliser en citant OpenStreetMap et en partageant à l'identique ce qu'on en tire. C'est pourquoi la carte reste hors des exports du registre.","la carte de Mions","Commune-grand.dc.html"],["offres-recues","Offres reçues","Le nombre d’entreprises qui ont répondu à l’appel d’offres, quand l’acheteur le publie dans les données de la commande publique (environ un contrat sur deux).","le contrat de Mions de 2025","Contrat-grand.dc.html"],["openstreetmap","OpenStreetMap","La carte libre et collaborative du monde, faite par ses contributeurs. Les caméras de la carte du site y sont relevées par des habitants ; ce n’est pas un inventaire officiel. Licence ODbL.","la carte de Mions","Commune-grand.dc.html"],["couverture","Pas encore collecté","« — » et « pas encore collecté » veulent dire qu'on n'a pas encore lu cette source pour ce département : ce n'est pas un zéro. « Aucun trouvé » veut dire que la source a été lue et ne contient rien.","Paris","Commune-grand.dc.html"],["plafond-partage","Plafond partagé","Un même maximum couvre plusieurs titulaires (accord-cadre attribué à plusieurs entreprises) ou plusieurs acheteurs (groupement de commandes, publié par chacun des membres). Ce maximum n'est donc pas la part d'un acheteur ni d'une entreprise.","Charenton-le-Pont","Documents-grand.dc.html"],["prefecture-zone","Préfecture de zone","La préfecture du Rhône est aussi préfecture de la zone de défense Sud-Est : elle autorise par exemple les caméras de tunnels autoroutiers en Savoie, en Haute-Savoie ou en Isère. L’arrêté est alors rattaché à la commune du site.","les tunnels autoroutiers","Autorisations-grand.dc.html"],["recueil","Recueil des actes administratifs","Le document où la préfecture publie ses arrêtés, plusieurs fois par mois. C'est là qu'on trouve les autorisations de caméras et de drones.","un arrêté de drones","Autorisations-grand.dc.html"],["region-sud","Région Sud","Le nom usuel de la Région Provence-Alpes-Côte d'Azur.","les subventions des Bouches-du-Rhône","Registre.dc.html"],["resultat","Résultat publié","L'avis, publié au BOAMP, qui annonce quelle entreprise a remporté un appel d'offres, et parfois pour quel montant.","un résultat à Mions","Contrat-grand.dc.html"],["siren","SIREN","Le numéro à neuf chiffres qui identifie une entreprise, une association ou une administration en France.","Alphaiota (SIREN 899832901)","Entreprise-grand.dc.html"],["sirene","SIRENE","Le répertoire officiel des entreprises et de leurs établissements, tenu par l'INSEE. Le site s'en sert pour vérifier le nom d'une entreprise ou d'un bénéficiaire.","une pharmacie nommée à Mions","Autorisations-grand.dc.html"],["subvention","Subvention","De l'argent versé par la Région ou l'État pour payer une partie des caméras. Le nombre de caméras est celui du projet présenté, pas forcément celui installé.","Mennecy","Commune-grand.dc.html"],["titulaire","Titulaire","L'entreprise (ou les entreprises) qui a remporté un contrat public.","Serfim T.I.C.","Entreprise-grand.dc.html"],["trace-indicatif","Tracé indicatif, tracé relu","La zone d’un arrêté de drones est placée automatiquement sur la carte quand c’est sûr (coordonnées GPS, commune entière, cercle autour d’une adresse avec son numéro) : c’est un tracé indicatif, en pointillé. Une liste de rues ou un lieu nommé est d’abord tracé à la main : c’est un tracé relu, en contour plein.","Meyzieu","CarteTemps-grand.dc.html"],["verifie","Vérifié à la main","Une personne a relu la ligne en la comparant au document d'origine. Les autres lignes sont lues automatiquement et peuvent contenir des erreurs : vous pouvez les signaler.","l'autorisation de Mions du 18 novembre 2025","Autorisations-grand.dc.html"],["videoverbalisation","Vidéoverbalisation","Le constat d'infractions routières (stationnement, feu rouge…) à partir des images des caméras, sans agent sur place. L'arrêté dit si la commune y est autorisée.","Mions","Commune-grand.dc.html"],["vsa","VSA (vidéosurveillance algorithmique)","Un logiciel qui analyse algorithmiquement les images pour repérer certains événements. Son usage par la police est encadré par une expérimentation légale (loi du 19 mai 2023, article 10).","le Stade de France","CarteTemps-grand.dc.html"],["zone-collectee","Zone collectée","Les départements où les documents ont été recherchés pour ce prototype : Paris, Rhône, Bouches-du-Rhône et Île-de-France. Ailleurs, seuls quelques contrats sont connus (ceux d'Alphaiota).","le Rhône","Departement-grand.dc.html"]];
    const q = norm(S.q.trim());
    const hit = G.filter((g) => !q || norm(g[1]).includes(q) || norm(g[2]).includes(q));
    const items = hit.map((g) => ({ id: 'g-' + g[0], anchor: '#g-' + g[0], t: g[1], d: g[2], hasEx: !!g[3], ex: g[3], href: g[4] }));
    return {
      th: dark ? 'th dark' : 'th', isDark: dark, isLight: !dark,
      themeLabel: dark ? 'Passer en thème clair' : 'Passer en thème sombre',
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
      nav: { reg: 'false', glo: 'page' },
      total: G.length, q: S.q, onQ: (e) => this.setState({ q: e.target.value }),
      items: items, none: hit.length === 0,
      countLabel: q ? hit.length + (hit.length > 1 ? ' mots trouvés' : ' mot trouvé') + ' (dans le mot ou sa définition)' : 'Par ordre alphabétique'
    };
  }
