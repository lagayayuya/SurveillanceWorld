# The administrations whose prefectoral acts the collection reads (pipeline/lacarte_collecte):
# the 101 départements' prefectures, the Préfecture de police, the regional prefectures and the
# overseas ones, with what was measured on 2026-10-31 (the national framing): the Attrap id
# when Attrap reads it (its own ids, facts, not its code), the address of the recueils' index
# (Attrap's data/sites.tsv and our own reading), `defi` when that host answers robots with an
# anti-robot check (our robot never asks it: no link check, no PDF), `parcours` when we read
# the index ourselves (Attrap's collector stopped, or no Attrap), the wave of the catching up
# (plan: 1 the prefectures read as they are, by their number of surveillance recueils over 12
# months, newest first; 2 the templates to adapt; 3 the rest), and `actes_12_mois`, Attrap's
# recueils with a surveillance act over the 12 months to 2026-10-31.
version: 1
id: rule:collecte_administrations@1
rationale: >-
  The framing's prefectures.csv and attrap.md (2026-10-31): 109 administrations in Attrap,
  756 of 756 pilot recueils found there; the collectors of the Loir-et-Cher (nothing since
  2025-09-22) and of Nouvelle-Calédonie (since 2026-09-01) stopped; the Préfecture de police
  and prefectures-regions.gouv.fr behind an anti-robot check.
# Read first, in this order, before the rest of wave 1 (Ju, 2026-11-01): Paris (the
# Préfecture de police, then the prefecture of Paris), the Bouches-du-Rhône, the
# Alpes-Maritimes; their threshold is measured first too.
en_tete: [ppparis, pref75, pref13, pref06]
