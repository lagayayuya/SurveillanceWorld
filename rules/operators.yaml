# Municipal operators in the communes' top operators (admin.py), spellings compared after
# lower-casing, removing accents and punctuation. `generic`: the town is not named ("Mairie",
# "Ville", "Ville (sans précision)"): "Ville de <commune where the camera stands>" (the
# city for a municipal arrondissement); `police`: "Police municipale de <commune>".
# `prefixes`: "Mairie de X", "ville de x", "Villes de Paris" and the bare town name become
# "Ville de <X>" with the official name when X is a commune of the region.
municipal:
  generic: [mairie, ville, villes, commune, municipalite, ville sans precision, hotel de ville]
  police: [police municipale]
  prefixes: [mairie, ville, villes, commune, hotel de ville]
# Operator values that say nothing about who films: left out of the top operators and
# counted apart ("dont N sans exploitant précis"). "yes" quoted: YAML reads it as a boolean.
no_information: [private, prive, inconnu, unknown, "yes", oui, public, none, "n a"]
