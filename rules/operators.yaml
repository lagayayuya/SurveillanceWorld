# Who operates a camera. Matched case-insensitively; first match wins.
version: 1
operator_type:
  public: [public, government, local_authority, council, "public/government", ville, military, police]
  private: [private, business, private_for_profit, private_non_profit, privé, corporation, private_individual, association, cooperative, religious, community, ngo]
# Regular expressions on the `operator` name that identify a public authority.
public_operator_patterns:
  - "\\b(ville|mairie|commune|municipal|police|gendarmerie|préfecture|prefecture)\\b"
  - "\\b(département|departement|conseil départemental|région|region|état|etat)\\b"
  - "\\b(ratp|sncf|dirif|cd ?\\d{2}|idfm|île-de-france mobilités)\\b"

# Normalised operator names, starting with the most frequent in Île-de-France (OSM
# `operator`, counted on the 2026-09-27 extract; every spelling with >= 10 cameras, plus
# their variants). `match` lists spellings compared after lower-casing, removing accents
# and replacing punctuation by spaces. `class` is used when no tag says who films
# (certainty "estimated"): public = public authorities and public bodies (State, local
# authorities, public transport and hospitals, public establishments, foreign states and
# international organisations); private = companies, associations, individuals.
names:
  - {name: SNCF, class: public, match: [sncf]}
  - {name: Préfecture de police, class: public, match: [prefecture de police de paris, prefecture de police, prefecture de paris]}
  - {name: Police municipale de Saint-Maur-des-Fossés, class: public, match: [police municipale de saint maur des fosses, police municipale de saint maur]}
