# The kinds of prefectoral acts the collection reads (pipeline/lacarte_collecte/parse_raa.py).
# Each kind: `titre`, a pattern on the act's title, and `dispositif`, a pattern on the first
# lines of what it decides (both on accent-free lower-case text); `exclure`, titles that
# are never a kind (a delegation of signature names cameras without authorising any);
# `priorite`, the order they are tried in (a drone act also names cameras). The search words
# (`recherche`) are what Attrap's full-text search is asked, per kind. Adding a kind (the
# protection perimeters, say) is an entry here and its fields in parse_raa.lire.
version: 1
id: rule:collecte_actes@1
rationale: >-
  The rules of the pilot's reader (rhone_raa/extract.py classify), measured on the Rhône
  (17 acts right out of 20) and the Moselle; the search words are those of the national
  framing's deep pass (2026-10-31).
# the time one recueil's reading may take (pipeline/lacarte_collecte/borne.py)
lecture:
  id: rule:collecte_actes@1:lecture
  rationale: >-
    Ju (2026-11-08): a slow pattern must never cost a whole run again. A recueil's reading
    takes well under a second (a summary of 300 acts, a few seconds); the one that held the
    runs from 11-05 to 11-08 would have taken hours. 120 s keeps every real recueil and
    stops such a one: its child process is killed, the recueil is noted « trop long » with
    its name in the run's report, read again only by the next reader version, and the run
    goes on.
  limite_s: 120

types:
  drone:
    priorite: 1
    titre: 'aeronef|drone'
    dispositif: 'captation.{0,60}cameras installees sur (?:un|des|deux|plusieurs)? ?aeronefs?'
    # and, unless the title authorises a captation, the acts on aircraft that film nothing for
    # the State: a flight ban (« interdiction de survol », « interdiction temporaire
    # d'exploitation et d'évolution », even « …de survol, de captation… »: a ban), jamming
    # (« brouillage », « rendre inopérant », « neutraliser », « anti-drone »), a show
    # (« spectacle aérien »), an overflight allowed, an ULM platform: 306 of the 7 825
    # drone acts collected by 2026-11-07, every one of two samples (25, 15) read by its title
    exclure: 'delegation de signature|subdelegation|ordre du jour|habilitation aem|cdac|^(?!.*autoris\w*.{0,80}(?:captation|cameras? installees?)).*(?:spectacles? (?:aeriens?|de drones?)|aeromodelisme|interdi\w*(?: temporaire)?(?: et)? (?:de |des |du |d.)?(?:survols?|exploitation|evolution|transport|voler|vol\b|usage|utilisation)|interdictionsurvol|survols?.{0,60}interdi|brouillage|rendre inoperant|neutraliser|anti.?drones?|autorisant le survol|ultra.?legers|\bulm\b)'
    recherche: '"caméras installées sur des aéronefs"'
  cameras_pietons:
    priorite: 2
    titre: 'cameras? individuelles|cameras?.pietons?|enregistrement audiovisuel des interventions'
    dispositif: 'cameras? individuelles|cameras?.pietons?|enregistrement audiovisuel des interventions'
    recherche: '"caméras individuelles" OR "caméras-piétons" OR "caméras piétons"'
  vsa:
    priorite: 3
    titre: 'traitement algorithmique|algorithmi'
    dispositif: 'traitement algorithmique'
    recherche: '"traitement algorithmique"'
  videoprotection:
    priorite: 4
    titre: 'video.?protection|video.?surveillance'
    dispositif: '(?:systeme|dispositif) de videoprotection.{0,400}(?:autoris|modifi|renouvel|abrog)'
    recherche: 'vidéoprotection OR "vidéo-protection" OR vidéosurveillance'
