# The drone and algorithmic-analysis zones of a commune (pipeline/lacarte_registre/fermetures.py
# zones → commune/<insee>.json, read by « Drones et algorithmes », web/src/registre/drones.ts).
# Not in buildinfo's hashed rules: no map build depends on it.
version: 1

commune_entiere:
  id: rule:registre_drones@1:commune_entiere
  part: 0.8
  rationale: >-
    A zone whose part inside the commune covers this share of the commune's area or more is
    the whole commune (v2.1 B1, Ju's review): its act says « le territoire de la commune », or
    the commune but for a few blocks, and drawn as a volume it would hold every other zone.
    0.8: Lyon's whole-commune zone covers 99.9 % of it, its largest localised one 10.2 %; a
    zone over four fifths of a commune no longer says where in it. Areas by the shoelace
    formula on an equirectangular projection at each ring's mean latitude, outer rings only;
    the commune's outline is its map's (carte/<insee>.json `contour`): without one, no zone
    is the whole commune.

publication:
  id: rule:registre_drones@1:publication
  rationale: >-
    « Publiés avant le vol ? »: a drone act's recueil is published before its first day of
    flight (« avant »), that day (« jour_meme ») or after (« apres »), counted in acts. The
    publication's day is the recueil's own (the prefecture's RAA), not the day Attrap first
    saw it: the recueil's day is what the public could read, and Attrap's is ours (a pilot's
    act takes the day of the recueil the collection read it in, under its id). The first day
    of flight is the act's first published day (`jours`), else its pilot's reviewed period;
    an act without one, or without a recueil, is in none of the three, counted in `non_lus`.
    `deps` the départements of the authorities whose acts are counted (the Préfecture de
    police's are the 75's wherever its acts are), so a page says whose acts these are, not
    « France ». Every act, without a window: the share says how the prefectures publish,
    not this year's flights.

fin:
  id: rule:registre_drones@1:fin
  rationale: >-
    An act read as a drone act is not a flight when it bans flights or ends an authorisation.
    A ban (« interdiction de survol », and a company's dispensation to fly at night: the SNCF,
    a drone show) names `interdiction` in its title and authorises no `captation` in its
    article 1: it is not a camera act, it leaves the register (reader 6 already leaves out the
    bans its title names). An abrogation or a withdrawal is the reader's « abrogation »
    (its title) or an article 1 that says so (`fin_article_1`, before its article 2: a title
    is often another act's, cut with it); one that « abroge et remplace » is a new
    authorisation (`remplace`). It stays a drone document, without days and out of the
    flights (`dr`, `jv`, « publiés avant le vol »). It ends the act whose number it cites
    (`cite`), looked up among the acts of its administration (the Préfecture de police's
    family: ppparis, pref75, pref92, pref93, pref94), the number compared by its digits, a
    single act only: a withdrawal (`retrait`) takes all its days, an abrogation those from
    its own day on (code des relations entre le public et l'administration, L. 240-1: the
    abrogation ends an act for the future, the withdrawal for the past and the future;
    re-read on 2026-11-08 by the project's author). Without a number read, or with a number found in no act or
    in two, the days stay and the abrogation is marked « non rattachée », counted in the
    build's summary.
  interdiction: "interdi|derogation"
  captation: "captation.{0,250}autoris|autoris.{0,250}captation"
  remplace: "(?:abroge|abrogeant|annulant|annule)\\w* et rempla"
  fin_article_1: "le present arrete abroge|(?:est|sont) (?:abroge|retire)s?\\b"
  retrait: "retrai|retir"
  famille_pp: [ppparis, pref75, pref92, pref93, pref94]
  cite:
    - "(?:abrogation|retrait)\\s+(?:de\\s+)?(?:[li]'|l )?(?:arrete|ap)\\s+(?:prefectoral\\s+)?(?:n[o°]?\\s*)?((?:[a-z]+[/-])*[a-z]*\\d[a-z0-9/_.-]*\\d)"
    - "(?:abrogeant|retirant|abroge|retire)\\s+(?:[li]'|l )?(?:arrete|ap)\\s+(?:prefectoral\\s+)?(?:n[o°]?\\s*)?((?:[a-z]+[/-])*[a-z]*\\d[a-z0-9/_.-]*\\d)"
    - "[li]'arrete\\s+(?:prefectoral\\s+)?(?:n[o°]?\\s*)?((?:[a-z]+[/-])*[a-z]*\\d[a-z0-9/_.-]*\\d)[^.]{0,250}?(?:est|sont)\\s+(?:abroge|retire)"

# What a drone act's article 1 says, read by rules where no model read it
# (pipeline/lacarte_registre/lecture_drones.py): the service that flies, the purposes of
# L. 242-5 it retains, the sector in its own words. Measured on the acts of the police
# prefecture and of Paris, Hauts-de-Seine, Seine-Saint-Denis, Val-de-Marne (1 967 acts,
# 2026-11-08), whose article 1 reads « la captation … par <service> sont autorisés <où et
# quand> aux titres de : <purposes> ». Their text layer splits words (« transmissio n »,
# « directionde ») and loses pieces: every pattern is matched on the folded text with its
# spaces removed, and a piece lost is « non lu », never guessed.
texte:
  id: rule:registre_drones@1:texte
  rationale: >-
    A service is served only when its name matches one of the list below (a name cut by the
    text layer is not completed); the purposes are the ids of collecte_champs.yaml
    `finalites`, the model's own; the sector is the act's words between « sont autorisés »
    and « au(x) titre(s) de », a hyphen's lost space mended, when that span is found and
    under 300 characters. Read for that family only: elsewhere the span is often a period
    (« du samedi 24 octobre … au dimanche … »), not measured. On the family's 1 543
    authorisations: a service 1 279 (83 %), purposes 1 505 (97 %), a sector 1 322 (86 %).
  services:
    - id: dopc
      libelle: Direction de l'ordre public et de la circulation (préfecture de police)
      motif: "(directiondel'?|del'?)?ordrepublicetdelacirculation"
    - id: dspap
      libelle: Direction de la sécurité de proximité de l'agglomération parisienne
      motif: "directionde(la)?securitede(la)?proximitedel'?agglomerationparisienne"
    - id: dtsp93
      libelle: Direction territoriale de la sécurité de proximité de Seine-Saint-Denis
      motif: "directionterritorialedelasecuritedeproximitede(la)?seine-?saint-?denis"
    - id: dtsp92
      libelle: Direction territoriale de la sécurité de proximité des Hauts-de-Seine
      motif: "directionterritorialedelasecuritedeproximitedeshauts-?de-?seine"
    - id: dtsp94
      libelle: Direction territoriale de la sécurité de proximité du Val-de-Marne
      motif: "directionterritorialedelasecuritedeproximiteduval-?de-?marne"
    - id: dtsp75
      libelle: Direction territoriale de la sécurité de proximité de Paris
      motif: "directionterritorialedelasecuritedeproximitedeparis"
    - id: emzds
      libelle: État-major de la zone de défense et de sécurité de Paris
      motif: "etat-?majordelazonededefenseetdesecuritedeparis"
    - id: srpt
      libelle: Sous-direction de la police régionale des transports
      motif: "sous-?directiondelapoliceregionaledestransports"
    - id: sdrcsr
      libelle: Sous-direction régionale de la circulation et de la sécurité routières
      motif: "sous-?directionregionaledelacirculationetdelasecuriteroutiere"
    - id: dipn78
      libelle: Direction interdépartementale de la police nationale des Yvelines
      motif: "directioninterdepartementaledelapolicenationaledesyvelines"
    - id: ggd78
      libelle: Groupement de gendarmerie départementale des Yvelines
      motif: "groupementdegendarmeriedepartementaledesyvelines"
    - id: gendarmerie
      libelle: Gendarmerie nationale
      motif: "gendarmerienationale"
  finalites:
    atteintes_personnes_biens: "atteintesalasecuritedespersonnesetdesbiens"
    rassemblements: "securitedesrassemblements"
    terrorisme: "actesdeterroris"
    flux_transport: "fluxdetransports?"
    frontieres: "surveillancedesfrontieres"
    secours: "secoursauxpersonnes"
    infractions: "constatationdesinfractions"
