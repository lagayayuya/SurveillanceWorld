entreprises:
  id: rule:registre_chiffres@1:entreprises
  rationale: >-
    A company's figures add the counted contracts it holds (alone or in a group). Its
    « concurrents » are not its rivals in a tender: DECP lists the winners, never the
    bidders. Two honest neighbours instead: the other holders of contracts of its buyers
    (« a aussi travaillé pour ses clients »), and the holders of contracts of the same
    nature in its départements. Its partners of a group (co-holders of one contract) are
    neither, listed apart. Sole traders are masked (regles.masquer_ei).
  top: 10
