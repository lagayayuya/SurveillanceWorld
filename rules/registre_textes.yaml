# The texts' repairs at the build (pipeline/lacarte_registre/textes.py): a title or an
# objet as its publisher garbled it, mended before any page shows it.
version: 1

apostrophes:
  id: rule:registre_textes@1:apostrophes
  rationale: >-
    Some publishers' software turns the typographic apostrophe (U+2019) and the « œ » into
    « ? » before the text reaches DECP, BOAMP or a recueil's index (« Plaques
    d?Immatriculation », « mise en ?uvre »): 93 documents and 26 affaires mended on the
    data of 2026-11-08, the raw source already so; 9 « ? » left between letters, 7 in act
    numbers read by an OCR, 2 in shops' names. A « ? » right after an elided
    word (d, l, j, n, s, t, c, m, qu and its compounds) and before a vowel or an h is an
    apostrophe; « ?uvre » is « œuvre ». Any other « ? » is kept: an OCR's noise in an act's
    number is not guessed. The apostrophe put back is the plain one, the one most titles use.
  remplacements:
    - motif: "(?i)\\b(jusqu|lorsqu|puisqu|presqu|quoiqu|qu|[dljnstcm])\\?(?=[aeiouyhàâäéèêëîïôöùûüœ])"
      par: "\\1'"
    - motif: "\\?uvre"
      par: "œuvre"
    - motif: "\\?UVRE"
      par: "ŒUVRE"

# A person named in a title or an objet (« concerts de [a singer] au Stade de France »,
# « visite du Pape [name] »): masked at the build, the event's kind and place kept. Measured
# 2026-11-09 on the collected acts: 43 titles name a performer or a public figure (42 of them
# drone acts). No natural person in the served data (Ju, 2026-11-09).
personnes:
  id: rule:registre_textes@1:personnes
  rationale: >-
    What follows « concert(s), spectacle(s), tournée(s), show(s), représentation(s) de / du /
    des » is a performer when it starts with a capital: its capitalised words are replaced by
    « […] », the mark the reader already puts for a name after a civility; a word in lower
    case (« au », « le ») ends it. A pope's name after « Pape » is dropped, the office kept.
    A capitalised group that is not a person (« spectacle de Noël ») is masked too: a lost
    word, never a person served.
  remplacements:
    - motif: "(?i:\\b(concerts?|spectacles?|tourn[ée]es?|shows?|représentations?)\\s+(de|du|des|d'|d’)\\s*)(?:(?i:la|le|les)\\s+|(?i:l'|l’))?[A-ZÉÈÀÂÊÎÔÛÇ][\\w'’.&-]*(?:\\s+(?:[A-ZÉÈÀÂÊÎÔÛÇ0-9][\\w'’.&-]*|(?:de|du|des|et|&)(?=\\s+[A-ZÉÈÀÂÊÎÔÛÇ])))*"
      par: "\\1 \\2 […]"
    - motif: "\\b([Pp]ape)\\s+[A-ZÉ][a-zéèêëîïôöûü]+(?:\\s+[IVXLC]+\\b)?"
      par: "\\1"
