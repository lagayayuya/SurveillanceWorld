# The publication threshold of the acts read (pipeline/lacarte_collecte/seuil.py), per
# département and kind: an act is right when every field the reference reading gives is
# right (its kind, its commune, and the kind's numbers, dates and hours); a number of
# cameras present and different is wrong (worse than absent). A kind is published in a
# département when its rate reaches `taux` and no number is wrong, measured on `echantillon`
# acts drawn at random since `depuis` (all of them when there are fewer), each read blind
# on the official PDF (on Attrap's text for the hosts we never ask). Below, the kind stays
# « non lu »: the list of its acts (title, date, official link), without a field read.
version: 1
id: rule:collecte_seuils@1
echantillon: 30
depuis: 2024-01-01
graine: 20261101
rationale: >-
  Ju's thresholds (2026-11-01): 95 % for video protection, whose numbers of cameras are
  counted on every page of the registre, 85 % for drones, read from freer texts (the Rhône:
  17 of 20, all 16 video-protection acts right); a wrong number never. Re-measured at every
  change of the reader.
types:
  videoprotection: {taux: 0.95}
  drone: {taux: 0.85}
  cameras_pietons: {taux: 0.95}
  vsa: {taux: 0.85}
# The commune an act names, read by the rules (lacarte_collecte.parse_raa: the communes of its
# authority's départements, by their official names), published for a kind everywhere when
# a drawing of acts read by hand reaches `taux`, whatever the département's own measure.
commune_par_regle:
  id: rule:collecte_seuils@1:commune_par_regle
  rationale: >-
    Ju (2026-11-09): 4 692 of 5 065 communes said « non lu » because the national
    collection's acts were not placed. The reader places 58 296 of 62 999 camera acts; the
    commune was published only where a reference reading measured it (13, 69). Measured
    2026-11-10 on 50 camera acts drawn among those placed (seed 20261110, 10 in each of the
    44, 67, 17, 02 and 07, each read by hand on Attrap's text): 49 right (98 %), the wrong one an
    establishment « route de Clisson - 44115 Basse-Goulaine » placed in Clisson (a street
    named after a commune). A second drawing (seed 20261111, 30 acts in the 59, 33, 31) found
    bundles of acts under one number and acts of several communes placed in their first one:
    13 of its 16 single acts right; they are now placed in none (`exclure_titre`,
    `communes_au_titre_max`). A third drawing among the acts so kept (seed 20261112, 30 in the
    35, 76, 83): 28 right, the 2 wrong « habilitations » to view a prison's images, no camera
    authorisation, now excluded too. In all, as served before that last exclusion, 90 of 93
    right (96.8 %); the second drawing wrote the bundle rule and the third the « habilitation »
    one, so the drawing that only measured is the third (28 of 30). Served at 95 % or more
    (Ju); an act with no commune read stays unplaced.
  taux: 0.95
  # an act that is not one establishment's: a bundle of acts under one number (« Arrêté n° VPA
  # / 2026 / 290 à 299 », « 31 arrêtés », « Arrêtés … (Commission du 15 octobre 2024) », the
  # Préfecture de police's « communication des arrêtés »), the commission's own composition;
  # and one whose title names two communes or more (France Travail's six agencies, bakeries in
  # three villages): placed in none (2026-11-10, a second drawing)
  exclure_titre: '\barretes\b|\b\d+ arretes\b|n° ?[\w /.-]*\d+ ?a ?\d+\b|\bcommission (?:departementale )?du\b|\bliste des\b|composition de la commission|communication des|habilitation|agrement|visionnage'
  communes_au_titre_max: 1
  types:
    videoprotection: {justes: 90, mesures: 93}

# The reference readings through Anthropic's Message Batches API (lacarte_collecte/
# references.py): the price per million tokens of each model the readings may use, input and
# output, read in the Claude API's model table (cached on 2026-10-06; Haiku's for prompts
# up to 100 000 tokens), and the batch's discount; a cache write costs 1.25 times the input,
# a read 0.1 times. They give each lot's real cost from the usage the API returns.
# `budget_dollars`: what the API may cost in all, reading and references (Ju, 2026-11-03: 110);
# reached, no new reading is sent until Ju raises it. `envoi_automatique`: whether a run sends
# the acts not yet read at its end (Ju, 2026-11-04: off until the R4.2 instruction is
# calibrated; the lots are then sent by hand, `modele lire`). `pause`: no call to the API at
# all, a run neither follows the batches in flight nor sends any (Ju, 2026-11-07: the reading
# by a model is paused; the batches' results stay at the API until it resumes).
references:
  budget_dollars: 110
  envoi_automatique: false
  pause: true
  prix:
    remise_lot: 0.5
    claude-haiku-5-5: {entree: 0.10, sortie: 0.50}
    claude-sonnet-5-5: {entree: 2.00, sortie: 10.00}
    claude-opus-5-5: {entree: 4.00, sortie: 20.00}
