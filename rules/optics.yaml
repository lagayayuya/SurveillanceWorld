# Observation levels (DORI, IEC 62676-4:2014) and provisional optical ranges per camera type.
#
# Sources: the IEC 62676-4 level definitions in pixels per metre, first-principles optics
# (PPM(d) = horizontal resolution / (2 d tan(hfov / 2))), and the camera catalogue
# (catalogue/models.csv, manufacturer datasheets) for the distributions generated at the
# end of this file by `lacarte calibrate`. Nothing here comes from other camera-mapping
# projects.
version: 4

# Pixels per metre at the target, IEC 62676-4:2014. Observation 62.5 is confirmed by a
# secondary source (Axis white paper on the 2014 edition: 63 px/m, 10 px for a 16 cm face).
levels:
  detection: 25
  observation: 62.5
  recognition: 125
  identification: 250
# Levels drawn on the map (observation also covers detection: everything >= 25 PPM).
displayed: [observation, recognition, identification]
display_floor: detection

# Reach estimates. The band of an estimate is the region where at least `p` of the
# (resolution, fov) samples reach the level at a point. Order: most to least certain; the
# bands are nested in that order.
#   certain   what nearly every camera of this type can do: to document without overstating
#   probable  a typical camera of its type (default)
#   cautious  a high-end camera (4K, zoom): to avoid being identified
estimates:
  certain: 0.9
  probable: 0.5
  cautious: 0.1
default_estimate: probable
# Estimate the map opens on (a web setting; the pipeline's reference is default_estimate):
# "Standard" (user decision 2026-09-30, after the iPhone test).
opening_estimate: probable
# Estimates offered on the map: "Standard" (probable) and "Prudent" (cautious), user decision
# 2026-09-30 (were "typical camera" / "high-end camera"). "certain" is still computed in the
# pipeline but put in no tile.
shown_estimates: [probable, cautious]
max_range_m: 180             # cap of the filled fields: covers every type but ALPR [TO ADJUST]
reach_cap_m: 300             # cap of the PTZ zoomed-reach outline (user decision 2026-09-28)
aspect_ratio: 0.5625         # 16:9, to derive the vertical fov from the horizontal one

calibration:
  # Release-year bands of the catalogue [TO ADJUST]; null = open.
  generations:
    "<=2015": [null, 2015]
    "2016-2019": [2016, 2019]
    "2020-2023": [2020, 2023]
    "2024+": [2024, null]
  # Share of each generation in the installed base, the same for every type. OSM does not
  # say when a camera was installed. Hypothesis [TO ADJUST]: renewal every 8 to 10 years
  # (hypothesis, unsourced), and a wave of installations in IDF before the 2024 Olympics
  # (hypothesis, unsourced).
  generation_mix:
    "<=2015": 0.20
    "2016-2019": 0.30
    "2020-2023": 0.35
    "2024+": 0.15
  # A type x generation cell needs this many catalogue models, else the type's pooled
  # distribution is used; a type below it keeps its provisional range [TO ADJUST].
  min_models: 5
  # Generations with no usable catalogue model on purpose-built search: their cells are
  # marked certainty "default" (estimated by default, with the pooled values) until a
  # manual pass on archived datasheets fills them (user decision 2026-09-28).
  default_generations: ["<=2015"]
  # Cameras of unknown type: domes and fixed cameras in their IDF proportions (8,297 domes,
  # 6,183 fixed on the 2026-09-27 extract).
  unknown_kind_mix: {dome: 0.573, fixed: 0.427}

# Version 4 (DECISIONS 2026-10-23): the multi-dome, an assembly of several domes.
assemblies:
  id: rule:optics@4:assemblies
  rationale: >-
    A multi-dome (user decision 2026-10-23) is several dome cameras mounted around one
    central housing, mapped as one object: OSM camera:type=dome with an integer
    camera:count of 2 or more (lacarte.osmtags.classify_kind; Key:camera:type documents no
    value for such an assembly, taginfo 2026-10-23: dome 93,448, panorama 1,184,
    panorama_with_ptz 266). Each of its domes is a dome: its optics are the dome's
    catalogue distributions (no new figure), its reach a dome's. Its field is the union of
    its domes' fields, a full circle: the domes face every way around the housing. A
    surveyed direction is not read into it: in the France extract of 2026-10-16, 45 of the
    84 domes with camera:count >= 2 carry exactly one camera:direction (28 of 48 with 2
    domes, 11 of 15 with 3, 6 of 6 with 4), one bearing for several domes, which says
    nothing of the others. The full circle holds when the number of domes is unknown too.
    Not under the direction rule (rules/direction.yaml): it is drawn like a panorama, not
    light.
  # Kind -> the kind whose optics each of its cameras has, and its field's opening.
  multidome: {optics_of: dome, opening_deg: 360}

# Provisional market ranges [TO ADJUST]: horizontal resolution (px) and horizontal field of
# view (degrees), least to most capable. Used only for types with too few catalogue models.
provisional_kinds:
  dome:     {resolution_px: [1280, 3840], hfov_deg: [30, 110]}
  fixed:    {resolution_px: [1280, 3840], hfov_deg: [30, 100]}
  ptz:      {resolution_px: [1920, 3840], hfov_deg: [55, 65], tele_hfov_deg: [2, 5]}
  panorama: {resolution_px: [2560, 5120], hfov_deg: [180, 360]}
  alpr:     {resolution_px: [1920, 2560], hfov_deg: [10, 35]}
  doorbell: {resolution_px: [1280, 2560], hfov_deg: [140, 180]}

# --- generated by `lacarte calibrate` from catalogue/models.csv on 2026-09-28; do not edit by hand ---
# Per type and generation: models used, then [p10, p50, p90] of the horizontal
# resolution (px) and of the horizontal field of view (deg; PTZ: wide end, tele end
# apart). `use: pooled` = too few models in the cell, the type's pooled values apply;
# `certainty: default` = estimated by default (calibration.default_generations).
