      hfov_deg: [40.1, 86.0, 111.0]
    generations:
      <=2015: {models: 0, use: pooled, certainty: default}
      2016-2019: {models: 2, use: pooled}
      2020-2023:
        models: 11
        resolution_px: [2150, 2688, 3840]
        hfov_deg: [51.0, 87.9, 111.0]
      2024+: {models: 4, use: pooled}
  panorama:
    pooled:
      models: 16
      resolution_px: [2203, 2688, 3984]
      hfov_deg: [116.9, 184.0, 360.0]
    generations:
      <=2015: {models: 0, use: pooled, certainty: default}
      2016-2019:
        models: 5
