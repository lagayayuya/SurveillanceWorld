# The registre's collection (pipeline/lacarte_registre/fetch.py, `lacarte-registre
# collecter`): who the robot says it is, how fast it asks each host, how long it waits and how
# often it tries again, and where each source is read. Every value has an id and a rationale,
# as the other rules. Not in buildinfo's hashed rules: no map build depends on it.
version: 1

robot:
  id: rule:registre_sources@1:robot
  # User-Agent: SurveillanceWorld/<version> (+<contact>); the contact is LACARTE_ROBOT_CONTACT,
  # never written here (no address in the repository): without it the robot does not start.
  name: SurveillanceWorld
  version: "1.0"
  rationale: >-
    An honest name, a version and a way to reach whoever runs it: what a host needs to tell
    us apart and to write to us rather than block us.

# The pace (pipeline/lacarte_registre/cadence.py): one queue per IP address, whatever the
# source and the process. An address's interval is the largest of the hosts met on it: a
# host's exact name below, else its longest matching pattern, else `default`; a host's
# robots.txt crawl-delay when it is larger.
pace:
  id: rule:registre_sources@2:pace
  strikes: 3
  pause_s: 2700
  slow_max: 8
  rationale: >-
    Three network cuts in a row on one address pause it 45 minutes for every process: a
    server that cuts us is left alone rather than asked again (the prefectures' shared
    server, 2026-10-31). A 429 or a 5xx doubles the address's interval, up to eight times;
    each other answer halves it back.

hosts:
  default:
    id: rule:registre_sources@1:pace_default
    interval_s: 1.0
    rationale: >-
      One request per second, the exploration's pace (design/registre/collecte/sources.md),
      for any host that publishes no rate of its own.
  "*.gouv.fr":
    id: rule:registre_sources@2:pace_gouv
    interval_s: 10.0
    rationale: >-
      The 101 sites of the prefectures (www.<département>.gouv.fr) and others of the State
      answer on one shared server, which cut our connections on 2026-10-31 after parallel
      collections sent it about a request per second: ten seconds between two requests on
      that server. The State's hosts listed by name below keep their own pace.
  attrap.fr:
    id: rule:registre_sources@2:pace_attrap
    interval_s: 10.0
    rationale: >-
      Attrap (La Quadrature du Net), an association's server, which publishes no rate: ten
      seconds, the pace of the national framing (2026-10-31), about 1 000 requests then
      without a refusal.
  echanges.dila.gouv.fr:
    id: rule:registre_sources@2:pace_dila
    interval_s: 1.0
    rationale: >-
      The DILA's open data archives (the BOAMP): one request per second, as before; the
      daily folder is about 370 files.
  www.data.gouv.fr:
    id: rule:registre_sources@2:pace_datagouv
    interval_s: 1.0
    rationale: >-
      data.gouv.fr's catalogue API (a dataset's resources): a few requests a collection, one
      per second; named so that `*.gouv.fr` does not slow its server's tabular API.
  tabular-api.data.gouv.fr:
    id: rule:registre_sources@1:pace_tabular
    interval_s: 1.0
    rationale: >-
      data.gouv.fr's tabular API, which serves the consolidated DECP row by row: one request
      per second, the pace of the exploration on data.gouv.fr.
  static.data.gouv.fr:
    id: rule:registre_sources@1:pace_static
    interval_s: 1.0
    rationale: >-
      data.gouv.fr's files (the DECP Parquet, the SIRENE file when it is published there):
      few requests, each a large file; one per second all the same.
  object.files.data.gouv.fr:
    id: rule:registre_sources@1:pace_object_files
    interval_s: 1.0
    rationale: >-
      Where data.gouv.fr stores INSEE's SIRENE files: few requests, one per second.
  recherche-entreprises.api.gouv.fr:
    id: rule:registre_sources@1:pace_recherche_entreprises
    interval_s: 1.1
    rationale: >-
      The API Recherche d'entreprises allows 7 requests per second (its documentation, read
      in the exploration); the exploration asked one per 1.1 s, kept here.
  geo.api.gouv.fr:
    id: rule:registre_sources@1:pace_geo
    interval_s: 1.0
    rationale: >-
      The API Découpage administratif (communes, intercommunalities, départements): three
      requests a collection, one per second.

# Waiting and trying again: on a network error, a 429 or a 503 (and a 502 or 504, a proxy's
# own), at most `attempts` tries, waiting `first_wait_s` then twice as long each time, never
# more than `max_wait_s` (a Retry-After the host gives is honoured within that bound). A 403
# or an anti-robot check is never tried again: the source stops and says so.
retries:
  id: rule:registre_sources@1:retries
  attempts: 8
  first_wait_s: 2
  max_wait_s: 120
  timeout_s: 120
  rationale: >-
    A slow or overloaded host gets room to recover (2, 4, 8 … seconds); eight tries cover a
    few minutes of outage, measured on data.gouv.fr in the exploration
    (rapport-v5.md § 4), without hammering a host that refuses us.

# robots.txt (RFC 9309): read once per host and kept for `cache_h` hours (§ 2.4: no more
# than 24 hours); a 4xx means no rule, a 5xx or no answer means everything is forbidden,
# an HTML page instead of a robots file is taken for an anti-robot check (unreachable).
robots:
  id: rule:registre_sources@1:robots
  cache_h: 24
  rationale: >-
    RFC 9309 § 2.3.1 and § 2.4; the exploration's rule (design/registre/collecte/robots_rule.py).

# Where each source is read. `decp`: the consolidated DECP, as a Parquet file when its host's
# robots.txt lets us, else row by row from data.gouv.fr's tabular API (the same file's
# rows, its CSV copy); `boamp`: the DILA's archives; `sirene`: INSEE's legal units
# file; `communes`: the API Découpage administratif.
sources:
  decp:
    id: rule:registre_sources@1:source_decp
    dataset: https://www.data.gouv.fr/api/1/datasets/donnees-essentielles-de-la-commande-publique-consolidees-format-tabulaire/
    parquet_title: decp.parquet
    csv_title: decp.csv
    tabular: https://tabular-api.data.gouv.fr/api/resources/{resource}/data/
    page_size: 200
    rationale: >-
      The consolidated DECP (Colin Maudry's decp-processing, published by data.gouv.fr,
      Licence Ouverte 2.0). static.data.gouv.fr serves www.data.gouv.fr's robots.txt, whose
      `Disallow: /resources` covers the Parquet's path (read on 2026-10-30): the tabular
      API (no robots.txt, a 404: no rule) serves the same rows, filtered by the server.
  boamp:
    id: rule:registre_sources@2:source_boamp
    archive: https://echanges.dila.gouv.fr/OPENDATA/BOAMP/
    first_year: 2015
    flux_jours: 2
    ftps:
      hote: echanges.dila.gouv.fr
      port: 990
      racine: /BOAMP/
      debit_ko_s: 1024
      timeout_s: 60
    rationale: >-
      The BOAMP's notices (DILA, Licence Ouverte 2.0) from the DILA's open data archives (no
      robots.txt there, a 404: no rule; read on 2026-10-31), read by lacarte_collecte. The
      records API (boamp-datadila.opendatasoft.com) is no longer read: its robots.txt,
      read on 2026-10-31, has `Disallow: /api/` for every agent but Googlebot (www.boamp.fr
      and data.opendatasoft.com serve the same rule). The version 1 of this rule read the API
      on a reading of that robots.txt the file of 2026-10-31 contradicts. The notices already
      served stay until the archive has read them again, under the same idweb.
      `flux_jours`: the last days read over HTTP (the daily flow). `ftps`: the history
      (2024 onwards, a file per notice) over the bulk channel data.gouv.fr announces, one
      connection, 1 MB/s at most, each file read in memory then dropped (Ju, 2026-11-01);
      implicit TLS on port 990 (port 21 does not answer), the tree under /BOAMP/ (both
      measured on 2026-11-01: a day of 503 files listed, a file of 51 715 bytes read, as
      over HTTP); a folder FTPS lists empty (its answer for a folder that does not exist)
      is asked over HTTP.
  dgcl:
    id: rule:registre_sources@2:source_dgcl
    dataset: https://www.data.gouv.fr/api/1/datasets/6176785207139a929a2776fe/
    tabular: https://tabular-api.data.gouv.fr/api/resources/{resource}/data/
    mots: [video, vidéo, camera, caméra]
    page_size: 200
    rationale: >-
      The DGCL's « Projets financés par les dotations de soutien à l'investissement des
      collectivités territoriales » (DETR, DSIL, DPV, DSID, 2018 onwards, Licence Ouverte
      2.0), found through the DGCL's « Bilan DI 2025 »: its 2025 file has 764 lines whose
      title says « video », the bilan's own count (read on 2026-10-31). static and
      files.data.gouv.fr are forbidden to robots; the tabular API serves the rows. Each word
      is asked (the titles are written with and without accents), then kept by the
      registre's video rule.
  attrap:
    id: rule:registre_sources@2:source_attrap
    api: https://attrap.fr/api/v1/
    depuis: 2024-01-01
    texte: attrap
    fraicheur_jours: 30
    mention_site: null
    rationale: >-
      Attrap (La Quadrature du Net) finds the recueils of 109 administrations and gives their
      full text: all 756 recueils of the pilot's official lists (Rhône, Essonne) were there,
      seen the day they were published (measured on 2026-10-31). `texte`: attrap (its text,
      the default: on the 25 acts measured, its text and our reading of the PDF always gave
      the same reading) or pdf (the official PDF, downloaded then deleted). Asked at
      collection time only, never by the site. For the Préfecture de police and the hosts of
      prefectures-regions.gouv.fr Attrap gets past an anti-robot check; Ju decided on
      2026-11-01 to take those acts from Attrap too, our robot never asking those hosts.
      `fraicheur_jours`: an administration without a new recueil for that long is said
      in the collection's report and on the coverage page (Attrap's Loir-et-Cher had
      none from 2025-09-22). `mention_site`: the one place a mention of Attrap would be
      added to the acts the site serves; empty (null) by Ju's decision of 2026-11-01:
      no page, no interface text, no served file names it for now.
  parcours:
    id: rule:registre_sources@2:source_parcours
    pages_max: 40
    rationale: >-
      Our own slow crawl of a recueils' index, where Attrap does not read: at most 40 index
      pages a night per administration (ten seconds each on the prefectures' shared server),
      the documents found read once.
  sirene:
    id: rule:registre_sources@1:source_sirene
    dataset: https://www.data.gouv.fr/api/2/datasets/5b7ffc618b4c4169d30727e0/resources/?page_size=100
    title_prefix: "Sirene : Fichier StockUniteLegale -"
    api: https://recherche-entreprises.api.gouv.fr/search
    rationale: >-
      INSEE's legal units (Base Sirene, Licence Ouverte 2.0): the monthly stock as Parquet
      (~714 MB), read for the units the registre meets only. Its path is under
      static.data.gouv.fr/resources, which that host's robots.txt forbids (read on
      2026-10-30): then the API Recherche d'entreprises (DINUM, the same units), one request
      per SIREN not yet known, its answers kept from one collection to the next.
  communes:
    id: rule:registre_sources@1:source_communes
    communes: https://geo.api.gouv.fr/communes?fields=code,nom,population,codeDepartement,codeEpci,siren,bbox&format=json
    epcis: https://geo.api.gouv.fr/epcis?fields=code,nom&format=json
    departements: https://geo.api.gouv.fr/departements?fields=code,nom&format=json
    rationale: >-
      Every commune of France with its département, its population, its intercommunality
      and its own SIREN (API Découpage administratif, INSEE's COG, Licence Ouverte 2.0): a
      buyer's SIREN becomes its commune, a commune its intercommunality; its box frames it on
      the drone view's map.
